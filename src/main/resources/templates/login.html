<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Login</title>

<link rel="stylesheet"
href="/css/style.css">

</head>

<body class="auth-page">

<div class="login-container">

<h2>Login</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button
onclick="login()">

Login

</button>

<p>

Don't have account?

<a href="/register-page">

Register Here

</a>

</p>

</div>

<script src="/js/login.js">

</script>

</body>

</html>
