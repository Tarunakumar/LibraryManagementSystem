<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Register</title>

<link rel="stylesheet"
href="/css/style.css">

</head>

<body class="auth-page">

<div class="login-container">

<h2>Register</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<select id="role">

<option value="ADMIN">

ADMIN

</option>

<option value="STUDENT">

STUDENT

</option>

</select>

<button
onclick="register()">

Register

</button>

<p>

Already have account?

<a href="/login-page">

Login

</a>

</p>

</div>

<script src="/js/register.js">

</script>

</body>

</html>
